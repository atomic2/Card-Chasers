<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Market | Card Chaser's</title>
    
    <style>
        :root {
            /* Main Functional Colors (Sleek NYR-esque palette) */
            --brand-primary: #1A73E8;    
            --brand-secondary: #2ECC71;  
            --brand-danger: #E74C3C;     

            /* UI Theme Colors */
            --bg-dark: #0A0D10;         
            --panel-dark: #1A1C21;      
            --sub-panel-dark: #24272D;  
            --border-subtle: #3D424A;   
            --text-main: #FFFFFF;       
            --text-sub: #BDC3C7;        
            
            --primary: #1A73E8;
            --glow: rgba(26, 115, 232, 0.4);
            --market-bg: var(--bg-dark);
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            background: var(--market-bg); 
            font-family: 'Arial', sans-serif;
            color: var(--text-main); 
            overflow-x: hidden; box-sizing: border-box;
            display: block; 
        }
        *, *:before, *:after { box-sizing: inherit; }

        .room-container { width: 100%; padding: 15px; box-sizing: border-box; margin: 0 auto; }

        .market-container { 
            width: 100%; max-width: 900px; margin: 0 auto; 
            display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; 
        }

        /* Top Controls */
        .exit-btn { align-self: flex-start; background: none; border: none; color: #8892b0; font-weight: 900; font-size: 0.95rem; cursor: pointer; padding: 0; margin-left: 5px; margin-bottom: -5px; text-transform: uppercase; font-family: 'Arial Black', sans-serif;}
        .exit-btn:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }

        .market-header { display: flex; justify-content: space-between; align-items: center; background: var(--panel-dark); padding: 15px 25px; border-radius: 16px; border-bottom: 6px solid var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.6); font-family: 'Arial Black', sans-serif;}
        .market-title { margin: 0; font-size: 1.6rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--glow); }
        .bank-readout { display: flex; gap: 15px; font-size: 0.9rem; color: #8892b0; }
        .bank-readout span { font-weight: 900; margin-left: 5px; }
        .stat-cash span { color: var(--brand-secondary); }

        .price-capsule {
            background: #111318; border: 1px solid var(--border-subtle); border-radius: 6px;
            padding: 4px 10px; font-family: monospace; color: #dddddd;
            display: inline-flex; align-items: center; gap: 4px; font-size: 0.9rem; font-weight: bold;
        }

        /* TOGGLE TABS */
        .tab-bar { display: flex; gap: 10px; width: 100%; margin-top: 5px; }
        .tab-btn { 
            flex: 1; padding: 12px; font-family: 'Arial Black', sans-serif; font-size: 1.1rem; 
            background: var(--panel-dark); border: 2px solid var(--border-subtle); border-radius: 8px; color: #8892b0; 
            cursor: pointer; text-transform: uppercase; transition: 0.1s; 
        }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 15px var(--glow); }

        .terminal-log { margin-top: 15px; background: #000; padding: 12px; border-radius: 8px; font-family: monospace; color: var(--brand-secondary); font-size: 0.95rem; text-align: center; border: 1px solid var(--border-subtle); font-weight: bold; }

        /* MARKET LISTINGS (BUY) */
        .listing-board { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        
        .trade-offer {
            display: flex; flex-direction: column; background: var(--panel-dark);
            border-left: 6px solid var(--primary); padding: 20px; border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-right: 1px solid var(--border-subtle);
            border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
            transition: transform 0.2s;
        }
        .trade-offer:hover { transform: translateY(-3px); box-shadow: 0 12px 25px var(--glow); }
        
        .seller-info { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); padding-bottom: 10px; font-family: 'Arial Black', sans-serif;}
        .trade-details { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 20px; }
        
        /* INVENTORY LISTINGS (SELL) */
        .sell-grid { 
            display: none; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; width: 100%; 
        }

        .action-buttons { display: flex; gap: 15px; width: 100%; }
        .btn {
            flex: 1; padding: 12px; font-family: 'Arial Black', sans-serif; font-size: 0.95rem;
            border: none; border-radius: 8px; color: #fff; cursor: pointer; text-transform: uppercase;
            transition: all 0.1s; border-bottom: 4px solid rgba(0,0,0,0.5); width: 100%;
        }
        .btn-buy { background: var(--brand-secondary); color: #000; border-bottom-color: #27ae60;}
        .btn-haggle { background: var(--brand-primary); border-bottom-color: #1557b0;}
        .btn-sell { background: var(--brand-danger); border-bottom-color: #922b21; font-size: 0.85rem;}
        .btn:active { transform: translateY(3px); border-bottom-width: 1px; }

        /* ====================================================
           MASTER BLUEPRINT: PREMIUM CARD DESIGN
           ==================================================== */
        .card-core { 
            background: #1c1c1e; border-radius: 12px; padding: 15px; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; 
            align-items: center; width: 100%; max-width: 220px; box-sizing: border-box; 
            position: relative; margin: 0 auto;
        }
        .pos-badge { position: absolute; top: 12px; left: 12px; border: 1px solid #5a5a5e; border-radius: 4px; padding: 3px 6px; font-size: 0.75rem; font-weight: 900; color: #ffffff; font-family: 'Arial Black', sans-serif; }
        .art-box { background: #121213; width: 110px; height: 110px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 3.5rem; margin-top: 25px; margin-bottom: 15px; }
        .card-title { font-size: 1.25rem; font-weight: 900; color: #FFFFFF; margin-bottom: 2px; text-align: center; }
        .card-descriptive-text { font-size: 0.7rem; color: #8e8e93; margin-bottom: 15px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Arial', sans-serif; font-weight: bold;}
        .data-panel-core { background: #242426; border: 1px solid #3a3a3c; border-radius: 8px; padding: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
        .data-title-gray { font-size: 0.6rem; color: #7a7a7e; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; text-align: center; letter-spacing: 0.5px; }
        .data-detail-green { font-size: 0.9rem; color: #00ff00; font-weight: bold; text-align: center; }

    </style>
</head>
<body>

    <div class="room-container">
        <div class="market-container">
            
            <button class="exit-btn" onclick="window.location.href='game_room.html'">◀ Back to Clubhouse</button>

            <div class="market-header">
                <h1 class="market-title" id="market-title">DIGITAL MARKET</h1>
                <div class="bank-readout">
                    <div class="stat-cash">CASH: <span id="bank-cash">$0</span></div>
                </div>
            </div>

            <div class="tab-bar">
                <button class="tab-btn active" id="tab-buy" onclick="switchTab('buy')">🛒 BUY CARDS</button>
                <button class="tab-btn" id="tab-sell" onclick="switchTab('sell')">💰 SELL ASSETS</button>
            </div>

            <div class="terminal-log" id="terminal-log">SECURE CONNECTION ESTABLISHED. BROWSE PEER-TO-PEER LISTINGS BELOW.</div>

            <div class="listing-board" id="listings-container"></div>
            <div class="sell-grid" id="sell-container"></div>

        </div> 
    </div> 
    
    <script>
        let currentSport = localStorage.getItem('selectedSport') || 'default';
        let playerCash = parseInt(localStorage.getItem('playerMoney')) || 0;

        const sportData = {
            nhl: { title: "HOCKEY EXCHANGE", primary: "#1A73E8", bg: "#0A0D10", key: "nhl_inventory", icon: "🏒", pool: [
                {name: "The Brick Wall", dna: "Igor Shesterkin (NYR)", pos: "G"}, {name: "Game Changer", dna: "Kirill Kaprizov (MIN)", pos: "LW"}, {name: "Rink Rat", dna: "Connor McDavid (EDM)", pos: "C"}, {name: "The Great 8", dna: "Alex Ovechkin (WSH)", pos: "RW"}, {name: "Blueline Boss", dna: "Cale Makar (COL)", pos: "LD"}
            ]},
            mlb: { title: "BASEBALL EXCHANGE", primary: "#2ECC71", bg: "#0A0D10", key: "mlb_inventory", icon: "⚾", pool: [
                {name: "Diamond King", dna: "Shohei Ohtani (LAD)", pos: "P"}, {name: "The Captain", dna: "Aaron Judge (NYY)", pos: "CF"}
            ]},
            nba: { title: "HOOPS EXCHANGE", primary: "#E67E22", bg: "#0A0D10", key: "nba_inventory", icon: "🏀", pool: [
                {name: "Crossover Master", dna: "Stephen Curry (GSW)", pos: "PG"}, {name: "King James", dna: "LeBron James (LAL)", pos: "SF"}
            ]},
            nfl: { title: "GRIDIRON EXCHANGE", primary: "#F1C40F", bg: "#0A0D10", key: "nfl_inventory", icon: "🏈", pool: [
                {name: "Showtime", dna: "Patrick Mahomes (KC)", pos: "QB"}, {name: "Run CMC", dna: "Christian McCaffrey (SF)", pos: "RB"}
            ]}
        };

        const activeSport = sportData[currentSport] || sportData['nhl'];
        document.documentElement.style.setProperty('--primary', activeSport.primary);
        document.documentElement.style.setProperty('--market-bg', activeSport.bg);
        document.getElementById('market-title').innerText = activeSport.title;

        const pricingMap = { "base": 50, "silver": 250, "gold": 1000, "platinum": 1500, "diamond": 2500 };
        const sellers = ["@IronLung", "@Tony_TopShelf", "@CardFather", "@Sniper99", "@GloveSave"];

        function updateBankUI() {
            document.getElementById('bank-cash').innerText = "$" + playerCash.toLocaleString();
            localStorage.setItem('playerMoney', playerCash);
        }
        updateBankUI();

        function switchTab(tab) {
            document.getElementById('tab-buy').classList.remove('active');
            document.getElementById('tab-sell').classList.remove('active');
            document.getElementById('tab-' + tab).classList.add('active');
            
            if (tab === 'buy') {
                document.getElementById('listings-container').style.display = 'flex';
                document.getElementById('sell-container').style.display = 'none';
                document.getElementById('terminal-log').innerText = "BROWSE PEER-TO-PEER LISTINGS BELOW.";
                document.getElementById('terminal-log').style.color = "#2ECC71";
            } else {
                document.getElementById('listings-container').style.display = 'none';
                document.getElementById('sell-container').style.display = 'grid';
                document.getElementById('terminal-log').innerText = "SELECT ASSETS FROM YOUR LOCKER TO LIQUIDATE FOR CASH.";
                document.getElementById('terminal-log').style.color = "#F1C40F";
                renderSellInventory();
            }
        }

        let activeListings = [];
        function generateListings() {
            for(let i=0; i<6; i++) {
                let template = activeSport.pool[Math.floor(Math.random() * activeSport.pool.length)];
                let roll = Math.random();
                let tier = roll > 0.9 ? 'diamond' : roll > 0.6 ? 'platinum' : roll > 0.3 ? 'gold' : 'silver';
                let price = pricingMap[tier];
                
                let variance = Math.floor(price * (Math.random() * 0.2 - 0.1));
                let askPrice = price + variance;

                activeListings.push({
                    id: 'list_' + i,
                    seller: sellers[Math.floor(Math.random() * sellers.length)],
                    rating: "⭐".repeat(Math.floor(Math.random() * 2) + 4),
                    card: { name: template.name, dna: template.dna, pos: template.pos, tier: tier, value: price },
                    askPrice: askPrice
                });
            }
            renderListings();
        }

        function renderListings() {
            const container = document.getElementById('listings-container');
            container.innerHTML = '';
            
            activeListings.forEach(listing => {
                let bColor = listing.card.tier === 'gold' ? '#f1c40f' : listing.card.tier === 'silver' ? '#bdc3c7' : listing.card.tier === 'platinum' ? '#e5e4e2' : '#00ffff';
                let shortPos = listing.card.pos.charAt(0);
                
                let html = `
                <div class="trade-offer" id="${listing.id}" style="border-left-color: ${bColor};">
                    <div class="seller-info">
                        <span>SELLER: ${listing.seller}</span>
                        <span>RATING: ${listing.rating}</span>
                    </div>
                    <div class="trade-details">
                        
                        <div class="card-core" style="margin: 0; max-width: 180px;">
                            <div class="pos-badge">${shortPos}</div>
                            <div class="art-box" style="width: 70px; height: 70px; font-size: 2rem; margin-top: 15px;">${activeSport.icon}</div>
                            <div class="card-title" style="font-size: 1rem;">${listing.card.name}</div>
                            <div class="card-descriptive-text" style="font-size: 0.6rem;">LOCKER 88 ${listing.card.tier.toUpperCase()}</div>
                            <div class="data-panel-core" style="padding: 6px;">
                                <div class="data-title-gray" style="font-size: 0.5rem;">STAT DNA MATCH</div>
                                <div class="data-detail-green" style="font-size: 0.75rem;">${listing.card.dna}</div>
                            </div>
                        </div>

                        <div style="text-align: right; min-width: 120px;">
                            <div style="font-size: 0.85rem; color:#8892b0; margin-bottom: 8px; font-family: 'Arial Black', sans-serif;">ASKING PRICE</div>
                            <span class="price-capsule">$${listing.askPrice.toLocaleString()} <span style="color:#2ecc71;">💵</span></span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-buy" onclick="buyOutright('${listing.id}', ${listing.askPrice})">BUY NOW</button>
                        <button class="btn btn-haggle" onclick="haggleOffer('${listing.id}', ${listing.askPrice})">MAKE OFFER</button>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        function addToInventory(cardData) {
            let inventory = JSON.parse(localStorage.getItem(activeSport.key)) || [];
            inventory.push({
                id: "c_" + Date.now(),
                name: cardData.name, dna: cardData.dna, pos: cardData.pos,
                tier: cardData.tier, value: cardData.value
            });
            localStorage.setItem(activeSport.key, JSON.stringify(inventory));
        }

        function removeListing(listingId, message, color) {
            let itemIndex = activeListings.findIndex(l => l.id === listingId);
            if (itemIndex > -1) {
                activeListings.splice(itemIndex, 1);
                renderListings();
                document.getElementById('terminal-log').innerText = message;
                document.getElementById('terminal-log').style.color = color;
            }
        }

        function buyOutright(listingId, price) {
            if (playerCash < price) {
                document.getElementById('terminal-log').innerText = "ERROR: INSUFFICIENT CASH FOR THIS TRANSACTION.";
                document.getElementById('terminal-log').style.color = "#E74C3C";
                return;
            }
            
            let listing = activeListings.find(l => l.id === listingId);
            playerCash -= price;
            updateBankUI();
            addToInventory(listing.card);
            removeListing(listingId, `TRANSACTION COMPLETE! PURCHASED ASSET FOR $${price.toLocaleString()}.`, "#2ECC71");
        }

        function haggleOffer(listingId, askPrice) {
            let listing = activeListings.find(l => l.id === listingId);
            let offerInput = prompt(`Market Ask for ${listing.card.dna} is $${askPrice}.\n\nEnter your counter-offer amount:`);
            
            if (offerInput === null) return;
            let offer = parseInt(offerInput);
            
            if (isNaN(offer) || offer <= 0) {
                alert("Invalid offer amount."); return;
            }
            if (offer > playerCash) {
                alert("You don't have enough cash to make that offer!"); return;
            }

            if (offer >= askPrice) {
                buyOutright(listingId, offer);
            } else if (offer < (askPrice * 0.75)) {
                removeListing(listingId, `OFFER REJECTED! ${listing.seller} WAS INSULTED BY YOUR $${offer} LOWBALL AND PULLED THE LISTING.`, "#E74C3C");
            } else {
                let chanceToAccept = (offer / askPrice) - 0.2; 
                if (Math.random() < chanceToAccept) {
                    playerCash -= offer;
                    updateBankUI();
                    addToInventory(listing.card);
                    removeListing(listingId, `NEGOTIATION SUCCESSFUL! ${listing.seller} ACCEPTED YOUR OFFER OF $${offer.toLocaleString()}.`, "#1A73E8");
                } else {
                    let counter = Math.floor((offer + askPrice) / 2);
                    let acceptCounter = confirm(`OFFER DECLINED.\n\n${listing.seller} countered with: $${counter}.\n\nDo you accept?`);
                    if (acceptCounter) {
                        if (playerCash < counter) { alert("Not enough cash to accept counter."); return; }
                        playerCash -= counter;
                        updateBankUI();
                        addToInventory(listing.card);
                        removeListing(listingId, `COUNTER-OFFER ACCEPTED! PURCHASED FOR $${counter.toLocaleString()}.`, "#2ECC71");
                    } else {
                        document.getElementById('terminal-log').innerText = "YOU WALKED AWAY FROM THE DEAL.";
                        document.getElementById('terminal-log').style.color = "#F1C40F";
                    }
                }
            }
        }

        function renderSellInventory() {
            const container = document.getElementById('sell-container');
            container.innerHTML = '';
            let inventory = JSON.parse(localStorage.getItem(activeSport.key)) || [];
            
            if (inventory.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #BDC3C7; padding: 40px; font-size: 1.2rem; font-family: 'Arial Black', sans-serif;">YOUR VAULT IS EMPTY. NO ASSETS TO SELL.</div>`;
                return;
            }

            inventory.sort((a,b) => b.value - a.value);

            inventory.forEach(card => {
                let trueVal = card.value || 50; 
                let fee = Math.floor(trueVal * 0.05);
                let payout = trueVal - fee;
                let shortPos = card.pos.charAt(0);

                // THE INJECTED PREMIUM CARD FOR THE SELL TAB
                container.innerHTML += `
                    <div class="card-core">
                        <div class="pos-badge">${shortPos}</div>
                        <div class="art-box">${activeSport.icon}</div>
                        
                        <div class="card-title">${card.name}</div>
                        <div class="card-descriptive-text">LOCKER 88 ${card.tier.toUpperCase()}</div>
                        
                        <div class="data-panel-core">
                            <div class="data-title-gray">STAT DNA MATCH</div>
                            <div class="data-detail-green">${card.dna}</div>
                        </div>

                        <div style="margin-top: 15px; width: 100%; border-top: 1px solid #3a3a3c; padding-top: 15px; text-align: center;">
                            <div style="font-size: 0.65rem; color: #E74C3C; margin-bottom: 5px; font-family: 'Arial Black', sans-serif;">-5% BROKER FEE</div>
                            <button class="btn btn-sell" onclick="sellCard('${card.id}', ${payout})">SELL FOR $${payout.toLocaleString()}</button>
                        </div>
                    </div>
                `;
            });
        }

        function sellCard(cardId, payout) {
            let inventory = JSON.parse(localStorage.getItem(activeSport.key)) || [];
            let cardIndex = inventory.findIndex(c => c.id === cardId);
            
            if(cardIndex > -1) {
                let card = inventory[cardIndex];
                inventory.splice(cardIndex, 1);
                localStorage.setItem(activeSport.key, JSON.stringify(inventory));
                
                playerCash += payout;
                updateBankUI();
                renderSellInventory(); 
                
                let realName = card.dna ? card.dna.split(' (')[0] : card.name;
                document.getElementById('terminal-log').innerText = `ASSET LIQUIDATED! ${realName.toUpperCase()} SOLD FOR $${payout.toLocaleString()}.`;
                document.getElementById('terminal-log').style.color = "#2ECC71";
            }
        }

        generateListings();
    </script>
</body>
</html>
