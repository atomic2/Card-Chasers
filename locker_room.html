<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Locker Room | Card Chaser's</title>
    <script src="data.js"></script>
    
    <style>
        :root {
            --primary: #1A73E8;
            --glow: rgba(26, 115, 232, 0.4);
            --vault-bg: #0A0D10;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            background: var(--vault-bg); 
            font-family: 'Arial', sans-serif;
            color: #FFFFFF; 
            box-sizing: border-box; overflow-x: hidden;
        }

        *, *:before, *:after { box-sizing: inherit; }

        .room-container { width: 100%; padding: 15px; margin: 0 auto; }
        .vault-container { width: 100%; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 40px; }

        /* Top Controls */
        .exit-btn { align-self: flex-start; background: none; border: none; color: #8892b0; font-weight: 900; font-size: 0.95rem; cursor: pointer; padding: 0; margin-left: 5px; margin-bottom: -5px; text-transform: uppercase; font-family: 'Arial Black', sans-serif; }
        .exit-btn:hover { color: #FFFFFF; text-shadow: 0 0 8px rgba(255,255,255,0.5); }

        .vault-header { display: flex; justify-content: space-between; align-items: center; background: #1A1C21; padding: 15px 25px; border-radius: 16px; border-bottom: 6px solid var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.6); font-family: 'Arial Black', sans-serif; }
        .vault-title { margin: 0; font-size: 1.6rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--glow); }

        .utility-bar { background: #1A1C21; padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #3D424A; font-family: 'Arial Black', sans-serif; }
        .pack-btn { background: #E74C3C; border: none; border-bottom: 5px solid #7f231c; padding: 12px 25px; border-radius: 8px; color: #fff; font-family: 'Arial Black', sans-serif; font-size: 1rem; cursor: pointer; text-transform: uppercase; }
        .pack-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
        
        .send-btn { background: #2ECC71; border: none; border-radius: 8px; padding: 12px 25px; color: #000; font-family: 'Arial Black', sans-serif; font-size: 1rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; width: 100%; max-width: 250px;}

        .pack-reveal-zone { background: #24272D; border: 3px solid #3D424A; border-radius: 20px; padding: 25px; display: none; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .pack-cards-display { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; width: 100%; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; background: rgba(0,0,0,0.2); border: 2px solid #3D424A; border-radius: 20px; padding: 25px; min-height: 350px; }
        .empty-msg { grid-column: 1 / -1; text-align: center; color: #BDC3C7; font-size: 1.2rem; padding-top: 100px; font-family: 'Arial Black', sans-serif; }

        /* ====================================================
           PREMIUM CARD DESIGN (Exact match to screenshot)
           ==================================================== */
        .card-core { 
            background: #1c1c1e; 
            border-radius: 12px; 
            padding: 15px; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            max-width: 220px;
            box-sizing: border-box; 
            position: relative;
            margin: 0 auto;
        }

        .pos-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            border: 1px solid #5a5a5e;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 0.75rem;
            font-weight: 900;
            color: #ffffff;
            font-family: 'Arial Black', sans-serif;
        }

        .art-box {
            background: #121213; 
            width: 110px;
            height: 110px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .card-title { 
            font-size: 1.25rem; 
            font-weight: 900; 
            color: #FFFFFF; 
            margin-bottom: 2px; 
            text-align: center; 
        }

        .card-descriptive-text { 
            font-size: 0.7rem; 
            color: #8e8e93; 
            margin-bottom: 15px; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .data-panel-core { 
            background: #242426; 
            border: 1px solid #3a3a3c; 
            border-radius: 8px; 
            padding: 10px; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box; 
        }

        .data-title-gray { 
            font-size: 0.6rem; 
            color: #7a7a7e; 
            text-transform: uppercase; 
            font-weight: 600; 
            margin-bottom: 4px; 
            text-align: center; 
            letter-spacing: 0.5px;
        }

        .data-detail-green { 
            font-size: 0.9rem; 
            color: #00ff00; 
            font-weight: bold; 
            text-align: center; 
        }
    </style>
</head>
<body>
    
    <div class="room-container">
        <div class="vault-container">
            <button class="exit-btn" onclick="window.location.href='game_room.html'">◀ Back to Clubhouse</button>
            
            <div class="vault-header">
                <h1 class="vault-title" id="vault-title">THE LOCKER ROOM</h1>
                <div style="font-size: 0.9rem; color: #BDC3C7;">TOTAL ASSETS: <span id="total-count" style="color:#FFFFFF; font-weight:900;">0</span></div>
            </div>

            <div class="utility-bar">
                <div style="font-size:0.85rem; color:#BDC3C7;">VAULT LEDGER: AUTOMATICALLY ORGANIZED HIGHEST TO LOWEST VALUE.</div>
                <button class="pack-btn" id="pack-pull-btn" onclick="openBoosterPack()">🎁 RIP PACK</button>
            </div>

            <div class="pack-reveal-zone" id="reveal-zone">
                <div style="color: #2ECC71; font-size: 1.1rem; letter-spacing: 1px; font-weight: bold;">PACK PULL INTEL REVEALED:</div>
                <div class="pack-cards-display" id="reveal-cards-row"></div>
                <button class="send-btn" onclick="closePackScreen()">SEND TO VAULT</button>
            </div>

            <div class="card-grid" id="display-grid"></div>

        </div> 
    </div> 

    <script>

// --- BRIDGE TO DATA.JS ---
const sportConfig = {
    nhl: { 
        key: 'nhl_inv', 
        title: 'NHL VAULT', 
        btnText: 'RIP NHL PACK', 
        icon: '🏒', 
        primary: '#1A73E8', 
        bg: '#0A0D10', 
        pool: window.SportsData.nhl.list.map(name => ({
            name: name.split(' (')[0], 
            dna: name, 
            pos: window.SportsData.nhl.positions[name.split(' (')[0]] || "UTIL"
        }))
    },
    mlb: { 
        key: 'mlb_inv', 
        title: 'MLB VAULT', 
        btnText: 'RIP MLB PACK', 
        icon: '⚾', 
        primary: '#E74C3C', 
        bg: '#100A0A', 
        pool: window.SportsData.mlb.list.map(name => ({
            name: name.split(' (')[0], 
            dna: name, 
            pos: window.SportsData.mlb.positions[name.split(' (')[0]] || "UTIL"
        }))
    },
    nba: { 
        key: 'nba_inv', 
        title: 'NBA VAULT', 
        btnText: 'RIP NBA PACK', 
        icon: '🏀', 
        primary: '#F39C12', 
        bg: '#1A1C21', 
        pool: window.SportsData.nba.list.map(name => ({
            name: name.split(' (')[0], 
            dna: name, 
            pos: window.SportsData.nba.positions[name.split(' (')[0]] || "UTIL"
        }))
    },
    nfl: { 
        key: 'nfl_inv', 
        title: 'NFL VAULT', 
        btnText: 'RIP NFL PACK', 
        icon: '🏈', 
        primary: '#8E44AD', 
        bg: '#1A1C21', 
        pool: window.SportsData.nfl.list.map(name => ({
            name: name.split(' (')[0], 
            dna: name, 
            pos: window.SportsData.nfl.positions[name.split(' (')[0]] || "UTIL"
        }))
    }
};




        let activeSport = localStorage.getItem('selectedSport') || 'nhl';
        
        const pricingMap = { "base": 50, "silver": 250, "gold": 1000, "platinum": 1500, "diamond": 2500 };
        const powerMap = { "base": "1x", "silver": "2x", "gold": "3x", "platinum": "6x", "diamond": "10x" };
        
               function initLocker() {
            const config = sportConfig[activeSport];
            document.documentElement.style.setProperty('--primary', config.primary);
            document.documentElement.style.setProperty('--vault-bg', config.bg);
            document.getElementById('vault-title').innerText = config.title;
            document.getElementById('pack-pull-btn').innerText = config.btnText;
            loadInventory();
        }

        function makeCardMarkup(card, icon) {
            let shortPos = card.pos ? card.pos.charAt(0) : "U"; 
            let bColor = card.tier === 'gold' ? '#f1c40f' : card.tier === 'silver' ? '#bdc3c7' : card.tier === 'platinum' ? '#e5e4e2' : card.tier === 'diamond' ? '#00ffff' : '#7f8c8d';
            let pwrString = card.power || powerMap[card.tier] || "1x";
            
            return `
                <div class="card-core" style="border: 2px solid ${bColor};">
                    
                    <div class="pos-badge">${card.pos || "UTIL"}</div>

                    <div class="art-box">${icon}</div>
                    
                    <div class="card-title">${card.name}</div>
                    <div class="card-descriptive-text">LOCKER 88 ${card.tier.toUpperCase()}</div>
                    
                    <div class="data-panel-core">
                        <div class="data-title-gray">STAT DNA MATCH</div>
                        <div class="data-detail-green">${card.dna}</div>
                    </div>
                    
                    <div style="margin-top: 15px; font-size: 0.8rem; color: #fff; font-weight: bold;">⚡ ${pwrString} Power</div>

                </div>
            `;
        }

        // --- NEW BULLETPROOF SORTING SCANNER ---
        function getSafeCardValue(card) {
            if (!card) return 0;
            // 1. Try to read explicit value (2500, 1500, etc.)
            if (card.value) return Number(card.value);
            // 2. If value is missing (older cards), read the tier and assign standard value
            if (card.tier) {
                let tierString = card.tier.toLowerCase();
                return pricingMap[tierString] || 0;
            }
            return 0; // Fallback
        }

        function loadInventory() {
            const grid = document.getElementById('display-grid');
            grid.innerHTML = '';
            let currentInv = JSON.parse(localStorage.getItem(sportConfig[activeSport].key)) || [];
            document.getElementById('total-count').innerText = currentInv.length;

            if (currentInv.length === 0) {
                grid.innerHTML = `<div class="empty-msg">VAULT EMPTY. RIP A PACK TO INITIALIZE SQUAD.</div>`;
                return;
            }

            // SAFE SORTING: Evaluates all cards using the scanner to guarantee proper high-to-low order
            currentInv.sort((a, b) => getSafeCardValue(b) - getSafeCardValue(a));

            currentInv.forEach(card => {
                grid.innerHTML += makeCardMarkup(card, sportConfig[activeSport].icon);
            });
        }

        function openBoosterPack() {
            const config = sportConfig[activeSport];
            let currentInv = JSON.parse(localStorage.getItem(config.key)) || [];
            let revealRow = document.getElementById('reveal-cards-row');
            revealRow.innerHTML = '';
            let freshlyPulled = [];

            for (let i = 0; i < 5; i++) {
                let template = config.pool[Math.floor(Math.random() * config.pool.length)];
                let roll = Math.random();
                let tier = 'base';

                if (roll > 0.96) tier = 'diamond';
                else if (roll > 0.85) tier = 'platinum';
                else if (roll > 0.65) tier = 'gold';
                else if (roll > 0.35) tier = 'silver';

                let newCard = {
                    id: "c_" + Date.now() + "_" + Math.random(),
                    name: template.name,
                    dna: template.dna,
                    pos: template.pos,
                    tier: tier,
                    value: pricingMap[tier],
                    power: powerMap[tier]
                };
                freshlyPulled.push(newCard);
                currentInv.push(newCard);
            }

            localStorage.setItem(config.key, JSON.stringify(currentInv));
            
            // Safe sort for newly pulled cards as well
            freshlyPulled.sort((a, b) => getSafeCardValue(b) - getSafeCardValue(a));
            freshlyPulled.forEach(card => revealRow.innerHTML += makeCardMarkup(card, config.icon));
            
            document.getElementById('reveal-zone').style.display = 'flex';
            loadInventory();
        }

        function closePackScreen() { 
            document.getElementById('reveal-zone').style.display = 'none'; 
        }

        initLocker();
    </script>
</body>
</html>
