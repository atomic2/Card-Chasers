<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agent Login | Card Chaser's</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #1a1512;
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)), 
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px), 
                              linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            font-family: 'Arial', sans-serif;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .auth-container {
            background: #050608;
            border: 4px solid #00ff66;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2), inset 0 0 20px rgba(0, 255, 102, 0.1);
            text-align: center;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .auth-container::before { content: '[SECURE UPLINK]'; position: absolute; top: -12px; left: 20px; background: #050608; color: #00ff66; font-family: monospace; font-size: 0.85rem; font-weight: 900; padding: 0 5px; }

        h2 { font-family: 'Arial Black', sans-serif; color: #00ff66; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        .sub-text { color: #8892b0; font-size: 0.8rem; margin-bottom: 10px; font-weight: bold; }
        
        .input-group { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        
        input {
            width: 100%;
            padding: 14px;
            background: #0A0D10;
            border: 2px solid #3D424A;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
            text-align: center;
            transition: all 0.2s ease;
        }
        input:focus { border-color: #ff9f43; outline: none; box-shadow: 0 0 10px rgba(255, 159, 67, 0.2); }
        input::placeholder { color: #4A525D; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        
        #handle-input { text-transform: lowercase; }
        #handle-input::placeholder { text-transform: uppercase; }

        /* Override width for the checkbox */
        input[type="checkbox"] { width: auto !important; padding: 0; }

        .btn-3d-container { position: relative; background: #0f1115; padding: 6px; border-radius: 12px; box-shadow: inset 0 4px 10px rgba(0,0,0,0.8); margin-top: 5px; }
        .action-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2d323f, #1b1e26);
            color: #ffffff;
            border: none;
            border-bottom: 6px solid #00ff66;
            border-radius: 8px;
            font-family: 'Arial Black', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0, 255, 102, 0.2);
            transition: transform 0.1s ease;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 255, 102, 0.3); }
        .action-btn:active { transform: translateY(4px); border-bottom-width: 2px; }

        .footer-links { display: flex; justify-content: space-between; margin-top: 10px; font-family: 'Arial Black', sans-serif; font-size: 0.8rem; }
        .footer-links button { background: none; border: none; color: #8892b0; cursor: pointer; padding: 0; text-transform: uppercase; }
        .footer-links button:hover { color: #FFFFFF; }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .auth-container {
                position: relative !important;
                width: 90% !important;
                margin: 20px auto !important;
                left: auto !important;
                top: auto !important;
                transform: none !important;
            }
            input, .action-btn { width: 100% !important; box-sizing: border-box !important; }
            input[type="checkbox"] { width: auto !important; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Identify</h2>
        <div class="sub-text">Enter Credentials</div>
        
        <div class="input-group">
            <input type="text" id="handle-input" placeholder="Agent Handle">
            <input type="password" id="pass-input" placeholder="Password">
        </div>
        
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 5px;">
            <input type="checkbox" id="remember-me" style="width: 18px; height: 18px; accent-color: #00ff66; cursor: pointer;">
            <label for="remember-me" style="color: #8892b0; font-family: 'Arial Black', sans-serif; font-size: 0.85rem; cursor: pointer;">Save Credentials</label>
        </div>

        <div class="btn-3d-container">
            <button class="action-btn" onclick="loginUser()">Access Hub</button>
        </div>

        <div class="footer-links">
            <button onclick="window.location.href='index.html'">◀ Cancel</button>
            <button onclick="window.location.href='register.html'">NEW RECRUIT? REGISTER ▶</button>
        </div>
    </div>

    <script src="config.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loginUser() {
            const handle = document.getElementById('handle-input').value.trim().toLowerCase();
            const password = document.getElementById('pass-input').value;
            
            if (!handle || !password) {
                alert("SYSTEM WARNING: Handle and password required.");
                return;
            }

            try {
                const userDocRef = db.collection("users").doc(handle);
                const userSnapshot = await userDocRef.get();

                if (!userSnapshot.exists) {
                    alert("ACCESS DENIED: Handle not found on the network.");
                    return;
                }

                const userData = userSnapshot.data();

                if (userData.password !== password) {
                    alert("SECURITY ALERT: Invalid password.");
                    return;
                }

                // Successful Login: Set baseline flags
                localStorage.setItem('avatarName', handle);
                localStorage.setItem('isRegistered', 'true');

                // Check for Smart Button bypass
                if (document.getElementById('remember-me').checked) {
                    localStorage.setItem('autoLogin', 'true');
                } else {
                    localStorage.removeItem('autoLogin');
                }
                
                window.location.href = 'playground.html';

            } catch (error) {
                console.error("Database connection failed:", error);
                alert("NETWORK ERROR: Unable to establish secure uplink. Try again.");
            }
        }
    </script>
</body>
</html>
