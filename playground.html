<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaser's Playground</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #000; font-family: 'Arial Black', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .banner-text { font-size: clamp(1.8rem, 6vw, 4rem); font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; text-shadow: 0 2px 10px rgba(255,255,255,0.2); }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; max-width: 800px; width: 100%; padding: 20px; }
        .sport-btn { width: 100%; height: 140px; cursor: pointer; outline: none; border: none; font-family: 'Arial Black', sans-serif; font-size: 1.6rem; font-weight: 900; color: #ffffff; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transform: translateY(-8px); transition: all 0.1s ease; }
        .btn-hockey { background: #1f618d; border-bottom: 12px solid #154360; box-shadow: 0 8px 0 #0e2c3f; }
        .btn-baseball { background: #1e8449; border-bottom: 12px solid #145a32; box-shadow: 0 8px 0 #0d3a20; }
        .btn-basketball { background: #ba4a00; border-bottom: 12px solid #7e3300; box-shadow: 0 8px 0 #542200; }
        .btn-football { background: #5d4037; border-bottom: 12px solid #3e2723; box-shadow: 0 8px 0 #271916; }
        .sport-btn:hover { transform: translateY(-10px); }
        .sport-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .sport-icon { font-size: 2.5rem; }
        @media (max-width: 600px) { .games-grid { grid-template-columns: 1fr; max-width: 340px; } .sport-btn { height: 90px; flex-direction: row; font-size: 1.3rem; } }
        .exit-link { position: absolute; top: 20px; left: 20px; background: #000; border: 2px solid #4c566a; color: #fff; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; z-index: 1000; transition: all 0.2s; }
        .exit-link:hover { border-color: #d8dee9; color: #ff9f43; transform: translateY(-2px); }
    </style>
</head>
<body>
    <button class="exit-link" onclick="window.location.href='index.html'">◀ Home</button>
    <h1 class="banner-text">CHASER'S PLAYGROUND</h1>
    <div class="games-grid">
        <button class="sport-btn btn-hockey" onclick="selectSport('nhl')"><span class="sport-icon">🏒</span>HOCKEY</button>
        <button class="sport-btn btn-baseball" onclick="selectSport('mlb')"><span class="sport-icon">⚾</span>BASEBALL</button>
        <button class="sport-btn btn-basketball" onclick="selectSport('nba')"><span class="sport-icon">🏀</span>BASKETBALL</button>
        <button class="sport-btn btn-football" onclick="selectSport('nfl')"><span class="sport-icon">🏈</span>FOOTBALL</button>
    </div>
    <script>
        function selectSport(sportKey) { localStorage.setItem('selectedSport', sportKey); window.location.href = 'game_room.html'; }
    </script>
</body>
</html>
